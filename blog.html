<!--
    blog.html

    Lanzar Mission Log container page hosting the future information terminal interface.

    Responsibilities

    - Terminal billboard UI shell rendering
    - Dynamic blog iframe display controls
    - Standard metadata and SEO definitions
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ======================================================
         SEO
    ======================================================= -->

    <title>LANZAR Mission Log | Web Design, Development & Digital Ideas</title>

    <meta
      name="description"
      content="Explore the LANZAR Mission Log: insights into web design, development, and branding from a veteran-owned custom digital solutions agency."
    />

    <meta
      name="keywords"
      content="LANZAR, veteran owned web design, veteran owned business, web design, web development, branding, digital solutions, Hudson MA, Massachusetts web designer"
    />

    <meta
      property="og:title"
      content="LANZAR Mission Log | Web Design & Digital Builds"
    />

    <meta
      property="og:description"
      content="Stories, ideas, and transmissions from LANZAR — exploring technology, design, and building the future of the web."
    />

    <meta property="og:type" content="website" />

    <meta property="og:url" content="https://lanzar.me/blog.html" />

    <meta
      property="og:image"
      content="https://lanzar.me/assets/images/billboard.png"
    />

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="LANZAR Mission Log | Web Design & Digital Builds"
    />

    <meta
      name="twitter:description"
      content="Behind the scenes, ideas, and philosophy from LANZAR."
    />

    <meta
      name="twitter:image"
      content="https://lanzar.me/assets/images/billboard.png"
    />
    <!-- ======================================================
         Cannonical
    ======================================================= -->
    <link rel="canonical" href="https://lanzar.me/blog.html" />

    <meta name="theme-color" content="#F46B45" />

    <!-- ======================================================
         FONTS
    ======================================================= -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- ======================================================
         CSS
    ======================================================= -->

    <link rel="stylesheet" href="css/theme.css" />

    <link rel="stylesheet" href="css/main.css" />

    <link rel="stylesheet" href="css/blog.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Blog",
        "name": "LANZAR Mission Log",
        "description": "Insights, philosophy, and stories from LANZAR about web design, development, and digital experiences.",
        "url": "https://lanzar.me/blog.html",
        "publisher": {
          "@type": "Organization",
          "name": "LANZAR",
          "url": "https://lanzar.me"
        }
      }
    </script>
  </head>

  <body>
    <!-- ======================================================
     TERMINAL HEADER
======================================================= -->

    <header class="terminal-header">
      <a href="index.html" class="terminal-logo">
        <img src="assets/logos/logo.svg" alt="LANZAR" />
      </a>

      <div class="terminal-tagline">
        <span> JON'S BLURBS </span>

        <small> NOTES FROM MISSION CONTROL </small>
      </div>

      <a href="index.html" class="terminal-return"> RETURN TO LAUNCH PAD </a>
    </header>

    <!-- ======================================================
     BACKGROUND
======================================================= -->

    <div class="background">
      <img src="assets/svg/background.svg" alt="" />
    </div>

    <main class="future-terminal">
      <!-- ======================================================
     TERMINAL SCENE
======================================================= -->

      <section class="terminal-scene">
        <!-- ==================================================
         BILLBOARD TERMINAL
    =================================================== -->

        <div class="journal-billboard">
          <img
            src="assets/images/billboard.png"
            alt="LANZAR Future Information Terminal"
          />

          <div class="terminal-screen">
            <iframe
              id="blog-display"
              src="blog/philosophy.html"
              title="LANZAR Journal Transmission"
            ></iframe>
          </div>
        </div>

        <!-- ==================================================
         CONTROLS
    =================================================== -->

        <div class="terminal-controls">
          <button id="previous" type="button">◀ PREV</button>

          <button id="home" type="button">HOME</button>

          <button id="next" type="button">NEXT ▶</button>
        </div>
      </section>

      <footer class="crawler-footer">
        <nav class="crawler-nav">
          <span class="crawler-title">TRANSMISSIONS:</span>
          <a href="blog/philosophy.html" class="crawler-link">Philosophy</a>
          <a href="blog/public-built.html" class="crawler-link"
            >Building In Public</a
          >
          <a href="blog/origin.html" class="crawler-link">Origin</a>
          <a href="blog/digital-frontier.html" class="crawler-link"
            >Digital Frontier</a
          >
          <a href="blog/catting-code.html" class="crawler-link">Catting Code</a>
          <a href="blog/ninety-nine-login.html" class="crawler-link"
            >The $99 Login Button</a
          >
        </nav>
      </footer>
    </main>

    <script src="js/blog.js"></script>
  </body>
</html>
